version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: iot_ecosystem
      POSTGRES_USER: iot_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-iot_secret_2024}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iot_admin -d iot_ecosystem"]
      interval: 5s
      timeout: 5s
      retries: 5

  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ./mosquitto/config/acl.conf:/mosquitto/config/acl.conf
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    ports:
      - "1883:1883"
      - "9001:9001"
    depends_on:
      - postgres

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: iot_ecosystem
      DB_USER: iot_admin
      DB_PASSWORD: ${POSTGRES_PASSWORD:-iot_secret_2024}
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      MQTT_USER: ${MQTT_BACKEND_USER:-backend_service}
      MQTT_PASSWORD: ${MQTT_BACKEND_PASSWORD:-backend_secret_2024}
      JWT_SECRET: ${JWT_SECRET:-jwt_super_secret_key_2024}
      JWT_EXPIRES_IN: 30d
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./nginx/conf/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/certs:/etc/nginx/certs
    ports:
      - "80:80"
      - "443:443"
      - "8883:8883"
    depends_on:
      - backend
      - mosquitto

volumes:
  postgres_data:
  mosquitto_data:
  mosquitto_log:
