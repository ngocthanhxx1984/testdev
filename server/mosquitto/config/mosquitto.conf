# Mosquitto MQTT Broker Configuration
# IoT Ecosystem Cloud Server

# Listeners
listener 1883
protocol mqtt

listener 9001
protocol websockets

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_type all

# Authentication — allow anonymous for initial setup
# In production, set to false and use password file or plugin
allow_anonymous true

# ACL
# acl_file /mosquitto/config/acl.conf

# Message size limit
message_size_limit 10240

# Keepalive
max_keepalive 120
