# ACL Configuration for IoT Ecosystem
# Backend service has full access
user backend_service
topic readwrite #

# ESP devices can publish/subscribe to their own topics
pattern readwrite v1/devices/%u/#
pattern write home/discovery

# App users can read all device topics and write commands
pattern readwrite v1/devices/+/command
pattern read v1/devices/+/state
pattern read v1/devices/+/status
pattern read home/discovery
pattern readwrite home/automation/#
